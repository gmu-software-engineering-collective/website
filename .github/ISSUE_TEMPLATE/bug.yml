name: Bug Report
description: Report unexpected or incorrect behavior
title: "[Bug]: "
labels:
  - "type: bug"
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Use this form to report unexpected or incorrect behavior.
        Provide enough information for another member to reproduce the problem.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What is going wrong?
      placeholder: Clearly describe the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe the expected behavior.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: What steps can another member follow to reproduce the bug?
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Enter ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add logs, screenshots, error messages, environment information, or other useful details.
      placeholder: Add any additional information here.
    validations:
      required: false
